project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "contributing.qmd"
    - "security.qmd"

website:
  title: "Kailash OS"
  description: "Kailash OS: a NixOS-based Linux distribution for AI security — offensive, defensive, and platform tooling in one declaratively built environment."
  site-url: https://kailash.site
  repo-url: https://github.com/kailash-os/kailash-website
  repo-branch: main
  repo-actions: [edit, issue]
  open-graph: true
  navbar:
    background: dark
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: index.qmd#taxonomy
        text: Taxonomy
      - href: index.qmd#architecture
        text: Architecture
      - href: index.qmd#roadmap
        text: Roadmap
      - href: index.qmd#governance
        text: Governance
    right:
      - href: index.qmd#paper
        text: Paper
      - href: contributing.qmd
        text: Contributing
      - href: security.qmd
        text: Security
      - icon: github
        href: https://github.com/kailash-os/kailash-os
  page-footer:
    left: "Kailash OS — GPL-2.0 licensed."
    right:
      - icon: github
        href: https://github.com/kailash-os/kailash-os

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    code-copy: true