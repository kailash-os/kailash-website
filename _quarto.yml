project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "roadmap.qmd"
    - "build.qmd"
    - "agents.qmd"
    - "contributing.qmd"
    - "security.qmd"
    - "tools.qmd"

website:
  title: "Kailash OS"
  description: "Kailash OS: a NixOS-based Linux distribution for AI security — offensive, defensive, and platform tooling in one declaratively built environment."
  site-url: https://kailash.site
  repo-url: https://github.com/kailash-os/kailash-website
  repo-branch: main
  repo-actions: [edit, issue]
  open-graph: true
  navbar:
    background: dark
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: index.qmd#taxonomy
        text: Taxonomy
      - href: index.qmd#architecture
        text: Architecture
      - href: index.qmd#governance
        text: Governance
      - href: tools.qmd
        text: Tools
      - href: build.qmd
        text: Build
      - href: https://docs.kailash.tools
        text: Docs
      - href: https://book.kailash.tools
        text: Cookbook
    right:
      - href: roadmap.qmd
        text: Roadmap
      - href: contributing.qmd
        text: Contributing
      - href: security.qmd
        text: Security
      - href: index.qmd#paper
        text: Paper
      - href: agents.qmd
        text: Agents
      - icon: github
        href: https://github.com/kailash-os
  page-footer:
    left: "Kailash OS — BSD-3-Clause licensed."
    right:
      - text: Docs
        href: https://docs.kailash.tools
      - text: Cookbook
        href: https://book.kailash.tools
      - icon: github
        href: https://github.com/kailash-os

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    code-copy: true
